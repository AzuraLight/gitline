<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- TypeScript blue circle -->
  <circle cx="64" cy="64" r="60" fill="#3178c6"/>

  <!-- Lightning lane: zigzag connecting four nodes -->
  <polyline points="46,28 80,52 46,76 80,100"
            fill="none"
            stroke="#ffffff"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- Nodes at each vertex -->
  <g fill="#ffffff">
    <circle cx="46" cy="28" r="9"/>
    <circle cx="80" cy="52" r="9"/>
    <circle cx="46" cy="76" r="9"/>
    <circle cx="80" cy="100" r="9"/>
  </g>
</svg>
